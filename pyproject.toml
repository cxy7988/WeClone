[project]
name = "WeClone"
version = "0.3.03"
description = "One-stop solution for creating your digital avatar from chat history"
authors = [{ name = "xming521" }]
readme = "README_zh.md"
requires-python = ">=3.12,<3.13"

dependencies = [
  "pandas",
  "pyjson5",
  "omegaconf",
  "click",
  "rich>=13,<15",
  "tqdm",
  "pydantic>=2.12,<3",
  "setuptools>=78.1.0",
  "loguru>=0.7.3",
  "langchain",
  "openai>=2,<4",
  "pip"
]

[tool.weclone]
# Configuration file version number. This number should be incremented when the configuration file structure or important default values change.
config_version = "0.3.04"

config_changelog = """
[0.3.00] - 2025-06-30 - Support TG chat logs, add language parameter, add log level parameter.
[0.3.02] - 2025-08-15 - Allow the use of the enable_thinking to control offline cleaning..
[0.3.03] - 2025-11-01 - Add chat member relationship switch.
[0.3.04] - 2026-08-12 - Separate training input/output paths from inference input paths.
"""

[dependency-groups]
main = [
  # Qwen3.5 requires Transformers 5.x. LLaMA-Factory 0.9.5 supports up to 5.6.0.
  "llamafactory==0.9.5",
  # vLLM 0.27.1's Linux wheel is built against the PyTorch 2.13 / CUDA 12.9 stack.
  "vllm==0.27.1+cu129; platform_system == 'Linux'",
  "torch==2.13.0+cu129; platform_system == 'Linux'",
  "torchvision==0.28.0+cu129; platform_system == 'Linux'",
  "torchaudio==2.11.0+cu129; platform_system == 'Linux'",
  "torch==2.7.1+cu126; platform_system == 'Windows'",
  "torchvision==0.22.1+cu126; platform_system == 'Windows'",
  "torchaudio==2.7.1+cu126; platform_system == 'Windows'",
  "torchdata>=0.10.0; platform_system == 'Linux' or platform_system == 'Windows'",
  "transformers==5.6.0",
  "accelerate==1.11.0",
  "peft==0.18.1",
  "trl==0.24.0",
  "flash-attn==2.8.3.post1; platform_system == 'Linux'",
  "flash-linear-attention[cuda]==0.5.2; platform_system == 'Linux'",
  "causal-conv1d==1.6.2.post1; platform_system == 'Linux'",
  "bitsandbytes>=0.46.1; platform_system == 'Linux' and platform_machine == 'x86_64'",
  "wandb>=0.23.0",
  "triton==3.7.1; platform_system == 'Linux'",
  "presidio_analyzer[transformers]",
  "presidio_anonymizer",
]
sparktts = [
  "einops>=0.8.1",
  "einx>=0.3.0",
  # vLLM 0.27.1 requires OpenCV 4.13+, which in turn requires NumPy 2.x.
  "numpy>=2,<3",
  "omegaconf>=2.3.0",
  "packaging>=24.2",
  "safetensors>=0.5.2",
  "soundfile>=0.12.1",
  "soxr>=0.5.0.post1",
  "torchaudio>=2.6.0",
  "tqdm>=4.66.5",
]

dev = ["pytest", "pytest-order", "pyright", "ruff", "pre-commit"]

[project.scripts]
weclone-cli = "weclone.cli:cli"

[project.entry-points."vllm.general_plugins"]
weclone-transformers-compat = "weclone.train.transformers_compat:patch_vllm_010_transformers5_tokenizer"

[tool.uv]
package = true
no-build-isolation-package = ["causal-conv1d", "flash-attn"]

[tool.uv.pip]
torch-backend = "auto"

[tool.uv.sources]
vllm = [
  { index = "vllm-cu129", marker = "platform_system == 'Linux'" },
]
torch = [
  { index = "pytorch-cu126", marker = "platform_system == 'Windows'" },
  { index = "pytorch-cu129", marker = "platform_system == 'Linux'" },
]
torchaudio = [
  { index = "pytorch-cu126", marker = "platform_system == 'Windows'" },
  { index = "pytorch-cu129", marker = "platform_system == 'Linux'" },
]
torchvision = [
  { index = "pytorch-cu126", marker = "platform_system == 'Windows'" },
  { index = "pytorch-cu129", marker = "platform_system == 'Linux'" },
]
triton = [
  { index = "pytorch-cu129", marker = "platform_system == 'Linux'" },
]
torchdata = [
  { index = "pytorch-cu126", marker = "platform_system == 'Windows'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[[tool.uv.index]]
name = "vllm-cu129"
url = "https://wheels.vllm.ai/0.27.1/cu129"
explicit = true

[tool.setuptools.packages.find]
where = ["."]                      
include = ["weclone*"]             
exclude = ["*tests*", "*archive*"]


[tool.pyright]
typeCheckingMode = "basic"
include = ["weclone/data"]
exclude = ["**/archive", "**/tests"]
ignore = ["**/archive"]

reportMissingImports = "error"
reportMissingTypeStubs = false

pythonVersion = "3.12"
pythonPlatform = "Linux"

[tool.ruff]
exclude = [
  "**/archive",
  "**/tests",
  "weclone-audio/src/server未完工",
  "weclone-audio/src/Spark-TTS",
]
line-length = 110

lint.ignore = ["F403", "F405", "E501", "E402"]
lint.select = [
  "F",     # Pyflakes
  "W",     # pycodestyle warnings
  "E",     # pycodestyle errors
  "ASYNC", # flake8-async
  "C4",    # flake8-comprehensions
  "Q",     # flake8-quotes
]
target-version = "py312"

[tool.pytest.ini_options]
addopts = "-x -v -s --tb=short"
